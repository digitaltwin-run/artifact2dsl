[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact2dsl"
version = "0.1.0"
description = "Evidence-bound artifact observation DSL and deterministic cross-artifact validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "digitaltwin-run"}]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4,<5", "pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
artifact2dsl = "artifact2dsl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artifact2dsl = ["schemas/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
