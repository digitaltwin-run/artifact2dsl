name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artifact2dsl
        uses: actions/checkout@v7

      - name: Check out pinned parser implementation
        uses: actions/checkout@v7
        with:
          repository: digitaltwin-run/twin-kicad
          ref: f48728c39d9ee15160580c4ea0f184aa33ee11dc
          path: twin-kicad

      - name: Check out pinned DSL standard
        uses: actions/checkout@v7
        with:
          repository: wellmanifest/dsl
          ref: 8b5ef587a0eda2d16b6f979b991f66c7b3590fbe
          path: wellmanifest-dsl

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -e twin-kicad
          python -m pip install --no-deps \
            -e packages/sch2dsl \
            -e packages/pcb2dsl \
            -e packages/svg2dsl \
            -e packages/cad2dsl

      - name: Test contracts and converters
        env:
          WELLMANIFEST_DSL_ROOT: ${{ github.workspace }}/wellmanifest-dsl
        run: make check

      - name: Test built wheels in a clean environment
        env:
          TWIN_KICAD_ROOT: ${{ github.workspace }}/twin-kicad
        run: make wheel-smoke
