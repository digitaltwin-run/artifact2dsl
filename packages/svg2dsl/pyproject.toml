[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svg2dsl"
version = "0.1.0"
description = "SVG to evidence-bound artifact2dsl observations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["artifact2dsl>=0.1.0,<0.2"]

[project.scripts]
svg2dsl = "svg2dsl.cli:main"

[project.entry-points."artifact2dsl.converters"]
".svg" = "svg2dsl:convert_path"

[tool.setuptools.packages.find]
where = ["src"]
